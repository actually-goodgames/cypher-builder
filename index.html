<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Builder Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 320px;
            background-color: #111827;
            border-right: 1px solid #374151;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #workspace {
            flex-grow: 1;
            position: relative;
        }
        h2 { font-size: 18px; margin-top: 0; color: #38bdf8; }
        label { font-size: 13px; color: #9ca3af; }
        select, button {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #4b5563;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #374151; }
        button.primary { background-color: #2563eb; border-color: #3b82f6; }
        button.primary:hover { background-color: #1d4ed8; }
        textarea {
            background-color: #030712;
            color: #34d399;
            border: 1px solid #374151;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            height: 80px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Cypher Builder Studio</h2>
        
        <div>
            <label>Select Base Asset / Shape</label>
            <select id="shapeSelect">
                <option value="box">3D Cube</option>
                <option value="sphere">3D Sphere</option>
                <option value="cylinder">3D Cylinder</option>
            </select>
        </div>

        <div>
            <label>Character Base Model</label>
            <select id="genderSelect">
                <option value="male">Default Male Model</option>
                <option value="female">Default Female Model</option>
            </select>
        </div>

        <div>
            <label>Clothing & Outfit</label>
            <select id="outfitSelect">
                <option value="casual">Casual Shirt & Shorts</option>
                <option value="armor">Sci-Fi Armor</option>
                <option value="suit">Formal Suit</option>
            </select>
        </div>

        <hr style="border-color: #374151; width:100%;">

        <button class="primary" onclick="generateExportCode()">Generate Game Code</button>

        <div>
            <label>Export Code String:</label>
            <textarea id="codeOutput" readonly placeholder="Click 'Generate Game Code' to get your string..."></textarea>
        </div>
    </div>

    <div id="workspace"></div>

    <script>
        // --- THREE.JS WORKSPACE SETUP ---
        const workspace = document.getElementById("workspace");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, workspace.clientWidth / workspace.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(workspace.clientWidth, workspace.clientHeight);
        workspace.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        let currentMesh;
        let geometry = new THREE.BoxGeometry();
        let material = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
        currentMesh = new THREE.Mesh(geometry, material);
        scene.add(currentMesh);
        camera.position.z = 3;

        // Update preview when shape changes
        document.getElementById("shapeSelect").addEventListener("change", (e) => {
            scene.remove(currentMesh);
            if (e.target.value === "box") geometry = new THREE.BoxGeometry();
            else if (e.target.value === "sphere") geometry = new THREE.SphereGeometry(0.7, 32, 32);
            else if (e.target.value === "cylinder") geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
            
            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (currentMesh) {
                currentMesh.rotation.x += 0.005;
                currentMesh.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }
        animate();

        // --- COMPILATION & STRING GENERATION ---
        function generateExportCode() {
            let configData = {
                version: "1.0",
                shape: document.getElementById("shapeSelect").value,
                gender: document.getElementById("genderSelect").value,
                outfit: document.getElementById("outfitSelect").value,
                color: "#38bdf8"
            };

            // Package into JSON and encode to base64 string
            let jsonString = JSON.stringify(configData);
            let encodedString = btoa(jsonString);

            // Display in text box
            document.getElementById("codeOutput").value = encodedString;
        }
    </script>
</body>
</html>

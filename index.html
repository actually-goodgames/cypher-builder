<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Builder Studio - Drag & Drop Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 400px;
            background-color: #050505;
            border-right: 2px solid #333333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #workspace {
            flex-grow: 1;
            position: relative;
            background-color: #000000;
        }
        h2 { font-size: 15px; margin: 0 0 10px 0; border-bottom: 1px solid #ffffff; padding-bottom: 5px; }
        label { font-size: 11px; color: #aaaaaa; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="color"], input[type="range"], input[type="file"] {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        button:hover { background-color: #cccccc; }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .shop-item {
            background-color: #111111;
            border: 1px solid #444444;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
        }
        .shop-item:hover {
            border-color: #ffffff;
            background-color: #222222;
        }
        textarea {
            background-color: #000000;
            color: #00ff00;
            border: 1px solid #333333;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            resize: none;
            height: 60px;
            width: 100%;
            box-sizing: border-box;
        }
        .section-box { border: 1px dashed #333333; padding: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>DIGITAL SHOP & ASSET INVENTORY</h2>
        <label>Click an asset to drop it into your workspace:</label>
        
        <div class="shop-grid">
            <div class="shop-item" onclick="spawnAsset('box')">[+] 3D Cube</div>
            <div class="shop-item" onclick="spawnAsset('sphere')">[+] 3D Sphere</div>
            <div class="shop-item" onclick="spawnAsset('cylinder')">[+] 3D Cylinder</div>
            <div class="shop-item" onclick="spawnAsset('torus')">[+] 3D Torus</div>
        </div>

        <div class="section-box">
            <h2>AI BUILDER ASSISTANT</h2>
            <input type="text" id="aiPrompt" placeholder="e.g., build a giant blue sphere...">
            <button onclick="runAiBuild()">Ask AI to Build</button>
        </div>

        <div class="section-box">
            <h2>SELECTED OBJECT PROPERTIES</h2>
            <label>Scale / Size</label>
            <input type="range" id="sizeRange" min="0.5" max="3.0" step="0.1" value="1.0" oninput="updateActiveProperties()">
            
            <label>Color Tint</label>
            <input type="color" id="colorPicker" value="#ffffff" onchange="updateActiveProperties()">

            <label>Physics Mode</label>
            <select id="physicsSelect" style="background:#000; color:#fff; border:1px solid #44; padding:8px; width:100%; font-family:monospace;" onchange="updateActiveProperties()">
                <option value="none">Static Anchor</option>
                <option value="gravity">Active Gravity / Fall</option>
            </select>

            <label>Upload Texture Image</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="loadTexture(event)">
        </div>

        <button onclick="publishToShop()" style="background-color: #00ff00; color: #000000;">PUBLISH TO VIRTUAL SHOP</button>

        <div>
            <label>Master Export String (Copy to Cypher Engine):</label>
            <textarea id="codeOutput" readonly placeholder="Publish to generate export code..."></textarea>
        </div>
    </div>

    <div id="workspace"></div>

    <script>
        const workspace = document.getElementById("workspace");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, workspace.clientWidth / workspace.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(workspace.clientWidth, workspace.clientHeight);
        workspace.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        camera.position.z = 5;

        let sceneObjects = [];
        let selectedObject = null;
        let uploadedTextureUrl = null;

        function spawnAsset(shapeType, customColor = "#ffffff", customSize = 1.0, physicsVal = "none") {
            let geometry;
            if (shapeType === "sphere") geometry = new THREE.SphereGeometry(customSize, 32, 32);
            else if (shapeType === "cylinder") geometry = new THREE.CylinderGeometry(customSize * 0.5, customSize * 0.5, customSize * 2, 32);
            else if (shapeType === "torus") geometry = new THREE.TorusGeometry(customSize, 0.3, 16, 100);
            else geometry = new THREE.BoxGeometry(customSize, customSize, customSize);

            let materialParams = { color: customColor };
            if (uploadedTextureUrl) {
                materialParams.map = new THREE.TextureLoader().load(uploadedTextureUrl);
            }

            let material = new THREE.MeshStandardMaterial(materialParams);
            let mesh = new THREE.Mesh(geometry, material);

            // Random spread offset in workspace
            mesh.position.set((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0);
            
            // Store properties data on the mesh object
            mesh.userData = {
                shape: shapeType,
                size: customSize,
                color: customColor,
                physics: physicsVal
            };

            scene.add(mesh);
            sceneObjects.push(mesh);
            selectedObject = mesh; // Auto-select latest spawned item
        }

        function updateActiveProperties() {
            if (!selectedObject) return;
            selectedObject.userData.size = parseFloat(document.getElementById("sizeRange").value);
            selectedObject.userData.color = document.getElementById("colorPicker").value;
            selectedObject.userData.physics = document.getElementById("physicsSelect").value;
            
            selectedObject.material.color.set(selectedObject.userData.color);
        }

        function loadTexture(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedTextureUrl = e.target.result;
                    if (selectedObject) {
                        selectedObject.material.map = new THREE.TextureLoader().load(uploadedTextureUrl);
                        selectedObject.material.needsUpdate = true;
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function runAiBuild() {
            let prompt = document.getElementById("aiPrompt").value.toLowerCase();
            if (!prompt) return;

            let shape = "box";
            let color = "#ffffff";
            if (prompt.includes("sphere") || prompt.includes("ball")) shape = "sphere";
            if (prompt.includes("ring") || prompt.includes("donut")) shape = "torus";
            if (prompt.includes("cylinder") || prompt.includes("pillar")) shape = "cylinder";

            if (prompt.includes("red")) color = "#ff0000";
            if (prompt.includes("blue")) color = "#0055ff";
            if (prompt.includes("green")) color = "#00ff00";

            spawnAsset(shape, color, 1.2, "gravity");
            alert(">> AI Bot successfully constructed and dropped item into your workspace!");
        }

        function publishToShop() {
            if (sceneObjects.length === 0) {
                alert(">> Workspace is empty! Drag or spawn items from the shop first.");
                return;
            }

            // Package all scene items into a master dataset
            let worldData = {
                version: "2.0",
                objects: sceneObjects.map(obj => ({
                    shape: obj.userData.shape,
                    size: obj.userData.size,
                    color: obj.userData.color,
                    physics: obj.userData.physics,
                    position: { x: obj.position.x, y: obj.position.y, z: obj.position.z }
                }))
            };

            let encodedString = btoa(JSON.stringify(worldData));
            document.getElementById("codeOutput").value = encodedString;
        }

        // Spawn a default item on load
        spawnAsset("box");

        function animate() {
            requestAnimationFrame(animate);
            sceneObjects.forEach(obj => {
                obj.rotation.x += 0.005;
                obj.rotation.y += 0.008;
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Builder Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 380px;
            background-color: #050505;
            border-right: 2px solid #333333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #workspace {
            flex-grow: 1;
            position: relative;
            background-color: #000000;
        }
        h2 { font-size: 16px; margin: 0 0 10px 0; border-bottom: 1px solid #ffffff; padding-bottom: 5px; }
        label { font-size: 11px; color: #aaaaaa; display: block; margin-bottom: 5px; }
        select, input[type="text"], input[type="color"], input[type="range"], input[type="file"] {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        button:hover { background-color: #cccccc; }
        textarea {
            background-color: #000000;
            color: #00ff00;
            border: 1px solid #333333;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            resize: none;
            height: 70px;
            width: 100%;
            box-sizing: border-box;
        }
        .section-box { border: 1px dashed #333333; padding: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>CYPHER STUDIO WORKBENCH</h2>

        <div class="section-box">
            <label>AI BOT BUILDER ASSISTANT</label>
            <input type="text" id="aiPrompt" placeholder="e.g., build a giant floating neon red moon...">
            <button onclick="runAiBotBuild()">Generate with AI Prompt</button>
        </div>

        <div>
            <label>Base Geometry Selection</label>
            <select id="shapeSelect" onchange="updatePreview()">
                <option value="box">3D Cube / Block</option>
                <option value="sphere">3D Sphere / Globe</option>
                <option value="cylinder">3D Cylinder / Pillar</option>
                <option value="torus">3D Torus / Ring</option>
            </select>
        </div>

        <div>
            <label>Object Scale / Size</label>
            <input type="range" id="sizeRange" min="0.5" max="3.0" step="0.1" value="1.0" oninput="updatePreview()">
        </div>

        <div>
            <label>Base Material Color</label>
            <input type="color" id="colorPicker" value="#ffffff" onchange="updatePreview()">
        </div>

        <div>
            <label>Upload Custom Image Texture (PNG/JPG)</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="loadTextureImage(event)">
        </div>

        <div>
            <label>Physics & Collision Engine</label>
            <select id="physicsSelect">
                <option value="none">Static (No Physics Forces)</option>
                <option value="gravity">Dynamic Rigidbody (Gravity Active)</option>
                <option value="bouncy">Elastic Soft-Body Bounce</option>
            </select>
        </div>

        <hr style="border-color: #333333; width:100%; margin: 5px 0;">

        <button onclick="generateExportCode()">COMPILE & GENERATE CODE</button>

        <div>
            <label>Master Export String Package:</label>
            <textarea id="codeOutput" readonly placeholder="Click compile to generate your system bridge code..."></textarea>
        </div>
    </div>

    <div id="workspace"></div>

    <script>
        const workspace = document.getElementById("workspace");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, workspace.clientWidth / workspace.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(workspace.clientWidth, workspace.clientHeight);
        workspace.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        let currentMesh;
        let uploadedTextureUrl = null;
        camera.position.z = 4;

        function updatePreview() {
            if (currentMesh) scene.remove(currentMesh);

            let shapeType = document.getElementById("shapeSelect").value;
            let size = parseFloat(document.getElementById("sizeRange").value);
            let colorHex = document.getElementById("colorPicker").value;

            let geometry;
            if (shapeType === "sphere") geometry = new THREE.SphereGeometry(size, 32, 32);
            else if (shapeType === "cylinder") geometry = new THREE.CylinderGeometry(size * 0.5, size * 0.5, size * 2, 32);
            else if (shapeType === "torus") geometry = new THREE.TorusGeometry(size, 0.3, 16, 100);
            else geometry = new THREE.BoxGeometry(size, size, size);

            let materialParams = { color: colorHex };
            if (uploadedTextureUrl) {
                const loader = new THREE.TextureLoader();
                materialParams.map = loader.load(uploadedTextureUrl);
            }

            let material = new THREE.MeshStandardMaterial(materialParams);
            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        function loadTextureImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedTextureUrl = e.target.result;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function runAiBotBuild() {
            let prompt = document.getElementById("aiPrompt").value.toLowerCase();
            if (!prompt) return;

            // Simulated AI parsing rules based on user prompt vocabulary
            if (prompt.includes("sphere") || prompt.includes("ball") || prompt.includes("planet")) {
                document.getElementById("shapeSelect").value = "sphere";
            } else if (prompt.includes("ring") || prompt.includes("donut")) {
                document.getElementById("shapeSelect").value = "torus";
            } else if (prompt.includes("tower") || prompt.includes("pillar")) {
                document.getElementById("shapeSelect").value = "cylinder";
            } else {
                document.getElementById("shapeSelect").value = "box";
            }

            if (prompt.includes("red")) document.getElementById("colorPicker").value = "#ff0000";
            else if (prompt.includes("blue")) document.getElementById("colorPicker").value = "#0055ff";
            else if (prompt.includes("green")) document.getElementById("colorPicker").value = "#00ff00";

            updatePreview();
            alert(">> AI Bot successfully constructed your layout specifications!");
        }

        updatePreview();

        function animate() {
            requestAnimationFrame(animate);
            if (currentMesh) {
                currentMesh.rotation.x += 0.008;
                currentMesh.rotation.y += 0.012;
            }
            renderer.render(scene, camera);
        }
        animate();

        function generateExportCode() {
            let dataPackage = {
                shape: document.getElementById("shapeSelect").value,
                size: parseFloat(document.getElementById("sizeRange").value),
                color: document.getElementById("colorPicker").value,
                physics: document.getElementById("physicsSelect").value,
                textureImage: uploadedTextureUrl,
                aiPrompt: document.getElementById("aiPrompt").value
            };

            let encoded = btoa(JSON.stringify(dataPackage));
            document.getElementById("codeOutput").value = encoded;
        }
    </script>
</body>
</html>

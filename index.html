<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Studio - Visual Game Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Left Tool Palette */
        #palette {
            width: 250px;
            background-color: #111827;
            border-right: 1px solid #1f2937;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }
        /* Center Canvas Workspace */
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #030712;
            background-image: linear-gradient(#1f2937 1px, transparent 1px), linear-gradient(90deg, #1f2937 1px, transparent 1px);
            background-size: 40px 40px;
        }
        /* Right Properties / Inspector Panel */
        #inspector {
            width: 280px;
            background-color: #111827;
            border-left: 1px solid #1f2937;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; margin: 0 0 5px 0; }
        .tool-btn {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .tool-btn:hover { background-color: #374151; border-color: #60a5fa; }
        input, select {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 13px;
        }
        .action-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn:hover { background-color: #1d4ed8; }
        textarea {
            background-color: #030712;
            color: #34d399;
            border: 1px solid #374151;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            height: 80px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="palette">
        <h3>Asset Palette</h3>
        <button class="tool-btn" onclick="spawnObject('box')">+ Add Platform Block</button>
        <button class="tool-btn" onclick="spawnObject('sphere')">+ Add Player Sphere</button>
        <button class="tool-btn" onclick="spawnObject('cylinder')">+ Add Obstacle Pillar</button>
        <button class="tool-btn" onclick="spawnObject('torus')">+ Add Portal Ring</button>

        <hr style="border-color: #1f2937; width:100%;">
        
        <h3>AI Assistant Studio</h3>
        <input type="text" id="aiPrompt" placeholder="e.g., generate space level...">
        <button class="action-btn" onclick="runAiBuild()">Ask AI Builder</button>
    </div>

    <div id="canvas-container"></div>

    <div id="inspector">
        <h3>Inspector Properties</h3>
        <div>
            <label style="font-size:11px; color:#9ca3af;">Scale / Size</label>
            <input type="range" id="sizeInput" min="0.5" max="3.0" step="0.1" value="1.0" oninput="updateSelectedProperties()">
        </div>
        <div>
            <label style="font-size:11px; color:#9ca3af;">Color Tint</label>
            <input type="color" id="colorInput" value="#3b82f6" onchange="updateSelectedProperties()">
        </div>
        <div>
            <label style="font-size:11px; color:#9ca3af;">Physics Rigidbody</label>
            <select id="physicsInput" onchange="updateSelectedProperties()">
                <option value="none">Static Obstacle</option>
                <option value="gravity">Dynamic Physics (Gravity)</option>
            </select>
        </div>

        <hr style="border-color: #1f2937; width:100%;">

        <button class="action-btn" style="background-color: #10b981;" onclick="exportGameData()">Export Game Package</button>
        <div>
            <label style="font-size:11px; color:#9ca3af;">Bridge Code String:</label>
            <textarea id="outputCode" readonly placeholder="Export to generate string..."></textarea>
        </div>
    </div>

    <script>
        const container = document.getElementById("canvas-container");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        camera.position.set(0, 2, 5);

        let sceneObjects = [];
        let selectedObject = null;

        function spawnObject(type, colorHex = "#3b82f6", scaleVal = 1.0, physicsVal = "none") {
            let geometry;
            if (type === "sphere") geometry = new THREE.SphereGeometry(scaleVal, 32, 32);
            else if (type === "cylinder") geometry = new THREE.CylinderGeometry(scaleVal*0.5, scaleVal*0.5, scaleVal*2, 32);
            else if (type === "torus") geometry = new THREE.TorusGeometry(scaleVal, 0.3, 16, 100);
            else geometry = new THREE.BoxGeometry(scaleVal, scaleVal, scaleVal);

            let material = new THREE.MeshStandardMaterial({ color: colorHex });
            let mesh = new THREE.Mesh(geometry, material);

            // Scatter placement so they don't stack on top of each other
            mesh.position.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 2, 0);
            
            mesh.userData = { type: type, color: colorHex, scale: scaleVal, physics: physicsVal };
            scene.add(mesh);
            sceneObjects.push(mesh);
            selectedObject = mesh;
        }

        function updateSelectedProperties() {
            if (!selectedObject) return;
            selectedObject.userData.scale = parseFloat(document.getElementById("sizeInput").value);
            selectedObject.userData.color = document.getElementById("colorInput").value;
            selectedObject.userData.physics = document.getElementById("physicsInput").value;

            selectedObject.material.color.set(selectedObject.userData.color);
            selectedObject.scale.set(selectedObject.userData.scale, selectedObject.userData.scale, selectedObject.userData.scale);
        }

        function runAiBuild() {
            let prompt = document.getElementById("aiPrompt").value.toLowerCase();
            if (!prompt) return;

            let shape = "box";
            let color = "#ef4444";
            if (prompt.includes("player") || prompt.includes("ball")) { shape = "sphere"; color = "#3b82f6"; }
            else if (prompt.includes("portal") || prompt.includes("ring")) { shape = "torus"; color = "#a855f7"; }
            else if (prompt.includes("pillar") || prompt.includes("tower")) { shape = "cylinder"; color = "#10b981"; }

            spawnObject(shape, color, 1.2, "gravity");
            document.getElementById("aiPrompt").value = "";
        }

        function exportGameData() {
            if (sceneObjects.length === 0) return;
            let worldData = {
                engine: "CypherStudio",
                objects: sceneObjects.map(obj => ({
                    type: obj.userData.type,
                    color: obj.userData.color,
                    scale: obj.userData.scale,
                    physics: obj.userData.physics,
                    position: { x: obj.position.x, y: obj.position.y, z: obj.position.z }
                }))
            };
            document.getElementById("outputCode").value = btoa(JSON.stringify(worldData));
        }

        // Spawn default setup block
        spawnObject("box");

        function animate() {
            requestAnimationFrame(animate);
            sceneObjects.forEach(obj => {
                obj.rotation.x += 0.005;
                obj.rotation.y += 0.01;
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
